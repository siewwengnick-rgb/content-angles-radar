    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {

      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(45, 212, 191, 0.12), transparent),
        radial-gradient(ellipse 40% 30% at 100% 0%, rgba(245, 158, 11, 0.06), transparent);

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    header { margin-bottom: 1.5rem; }

    .brand-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .brand { display: flex; flex-direction: column; gap: 0.35rem; }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      width: fit-content;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(45, 212, 191, 0.25);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
    }

    .brand-badge .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    h1 {
      font-size: clamp(1.55rem, 4vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    .meta .date { color: var(--text); font-weight: 500; }

    .note-bar {
      margin: 0 0 1.25rem;
      padding: 0.75rem 1rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.45;
    }
    .note-bar a { color: var(--accent); text-decoration: none; }
    .note-bar a:hover { text-decoration: underline; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
      margin-bottom: 0.5rem;
    }

    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; }

    .chip {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      padding: 0.45rem 0.95rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .chip:hover { border-color: rgba(45, 212, 191, 0.4); color: var(--text); }
    .chip.active {
      background: var(--accent-dim);
      border-color: rgba(45, 212, 191, 0.55);
      color: var(--accent);
      box-shadow: 0 0 0 1px rgba(45, 212, 191, 0.15);
    }
    .chip.active.ot-chip {
      background: var(--ot-dim);
      border-color: var(--ot-border);
      color: var(--ot);
      box-shadow: none;
    }
    .chip.active.ff-chip {
      background: var(--ff-dim);
      border-color: var(--ff-border);
      color: var(--ff);
      box-shadow: none;
    }

    .search-wrap { flex: 1; min-width: 180px; max-width: 320px; }
    .search-wrap input {
      width: 100%;
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-family: inherit;
      font-size: 0.875rem;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      outline: none;
    }
    .search-wrap input:focus {
      border-color: rgba(45, 212, 191, 0.5);
      box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.12);
    }
    .search-wrap input::placeholder { color: #64748b; }

    .count-bar {
      margin: 0.85rem 0 0.25rem;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }
    .count-bar strong { color: var(--accent); font-weight: 600; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.35rem;
      margin-top: 1rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      cursor: pointer;
      text-align: left;
      color: inherit;
      font: inherit;
      padding: 0;
      width: 100%;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(45, 212, 191, 0.28);
      background: var(--card-hover);
    }
    .card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .card.hidden { display: none; }

    .card-img {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #0f172a;
    }
    .card-img img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform 0.35s ease;
    }
    .card:hover .card-img img { transform: scale(1.04); }

    .ph {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.4rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 8px rgba(0,0,0,0.35);
    }
    .ph.ig {
      background: linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%);
    }
    .ph.ot-ph {
      background: linear-gradient(135deg, #78350f 0%, #f59e0b 55%, #fbbf24 100%);
    }
    .ph.ff-ph {
      background: linear-gradient(135deg, #0f766e 0%, #2dd4bf 55%, #67e8f9 100%);
    }
    .ph .ph-label { font-size: 0.75rem; opacity: 0.9; text-transform: uppercase; }
    .ph .ph-brand { font-size: 1.35rem; }

    .platform-tag {
      position: absolute;
      top: 0.7rem; left: 0.7rem;
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase;
      padding: 0.25rem 0.5rem; border-radius: 6px;
      color: #fff; backdrop-filter: blur(4px);
      background: rgba(15, 23, 42, 0.72);
    }
    .platform-tag.yt { background: rgba(220, 38, 38, 0.85); }
    .platform-tag.ig { background: rgba(219, 39, 119, 0.85); }

    .views-tag {
      position: absolute;
      bottom: 0.65rem; right: 0.65rem;
      font-size: 0.7rem; font-weight: 600;
      padding: 0.2rem 0.5rem; border-radius: 6px;
      background: rgba(15, 23, 42, 0.75);
      color: #e2e8f0;
      backdrop-filter: blur(4px);
    }

    .card-body {
      padding: 1.05rem 1.1rem 1.15rem;
      display: flex; flex-direction: column; gap: 0.5rem;
      flex: 1;
    }

    .card-top {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 0.5rem;
    }

    .pill {
      font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase;
      padding: 0.22rem 0.55rem; border-radius: 999px;
      white-space: nowrap;
    }
    .pill.ot { color: var(--ot); background: var(--ot-dim); border: 1px solid var(--ot-border); }
    .pill.ff { color: var(--ff); background: var(--ff-dim); border: 1px solid var(--ff-border); }

    .status-tag {
      font-size: 0.65rem; font-weight: 700;
      padding: 0.2rem 0.45rem; border-radius: 6px;
      color: var(--rising);
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.3);
      white-space: nowrap;
    }
    .status-tag.keep {
      color: #94a3b8;
      background: rgba(148, 163, 184, 0.1);
      border-color: rgba(148, 163, 184, 0.25);
    }
    .status-tag.watch {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.1);
      border-color: rgba(251, 191, 36, 0.28);
    }

    .card-title {
      font-size: 1.02rem; font-weight: 650;
      letter-spacing: -0.01em; line-height: 1.35;
    }

    .pain {
      font-size: 0.8rem; color: var(--text-muted);
      line-height: 1.45;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }

    .hook {
      font-size: 0.84rem; color: #cbd5e1;
      line-height: 1.4;
      border-left: 2px solid rgba(45, 212, 191, 0.45);
      padding-left: 0.65rem;
      margin-top: 0.1rem;
    }
    .hook::before { content: "钩子 · "; color: var(--accent); font-size: 0.72rem; font-weight: 600; }

    .meta-row {
      display: flex; flex-wrap: wrap; gap: 0.35rem 0.55rem;
      font-size: 0.72rem; color: var(--text-muted);
      margin-top: 0.15rem;
    }
    .meta-row span {
      background: rgba(148, 163, 184, 0.08);
      padding: 0.15rem 0.45rem; border-radius: 6px;
    }

    .compliance-snip {
      font-size: 0.7rem; color: #64748b;
      line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }

    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: auto; padding-top: 0.6rem;
      border-top: 1px solid var(--border);
    }
    .score { font-size: 0.75rem; color: var(--text-muted); }
    .score strong { color: var(--accent); }
    .open-hint {
      font-size: 0.78rem; font-weight: 600; color: var(--accent);
    }

    .empty {
      display: none; text-align: center;
      padding: 3rem 1rem; color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .empty.visible { display: block; }

    footer.page-foot {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem;
    }
    footer.page-foot a { color: var(--accent); text-decoration: none; }
    footer.page-foot a:hover { text-decoration: underline; }

    /* Side panel */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(2, 6, 23, 0.55);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 40;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }

    .panel {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: var(--panel-w);
      background: var(--bg-elevated);
      border-left: 1px solid var(--border);
      box-shadow: -12px 0 40px rgba(0,0,0,0.4);
      z-index: 50;
      transform: translateX(105%);
      transition: transform 0.25s ease;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .panel.open { transform: translateX(0); }

    .panel-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 0.75rem;
      padding: 1.15rem 1.2rem 0.9rem;
      border-bottom: 1px solid var(--border);

    .panel-head h2 {
      font-size: 1.15rem; font-weight: 700;
      letter-spacing: -0.01em; line-height: 1.35;

      background: var(--card); color: var(--text-muted);
      width: 2rem; height: 2rem; border-radius: 8px;
      cursor: pointer; font-size: 1.1rem; line-height: 1;
      flex-shrink: 0;

    .panel-close:hover { color: var(--text); border-color: rgba(45,212,191,0.4); }

    .panel-body {
      padding: 1.1rem 1.2rem 2rem;
      overflow-y: auto; flex: 1;
      display: flex; flex-direction: column; gap: 1.1rem;
    }

    .panel-section h3 {
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 0.45rem;

    .panel-section p, .panel-section li {
      font-size: 0.875rem; color: #cbd5e1; line-height: 1.5;

    .panel-section ul { padding-left: 1.1rem; }
    .panel-section li { margin-bottom: 0.35rem; }

    .hook-list { list-style: none; padding: 0; }
    .hook-list li {
      padding: 0.55rem 0.7rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 0.4rem;
    }
    .hook-list .ht {
      font-size: 0.68rem; color: var(--accent); font-weight: 600;
      display: block; margin-bottom: 0.15rem;
    }

    .ref-list { list-style: none; padding: 0; }
    .ref-list li {
      margin-bottom: 0.5rem;
      padding: 0.65rem 0.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .ref-list a {
      color: var(--text); text-decoration: none; font-weight: 600;
      font-size: 0.84rem; display: block; line-height: 1.35;
    }
    .ref-list a:hover { color: var(--accent); }
    .ref-meta { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.25rem; }

    .compliance-box {
      font-size: 0.8rem; color: #94a3b8;
      padding: 0.7rem 0.8rem;
      background: rgba(251, 191, 36, 0.06);
      border: 1px solid rgba(251, 191, 36, 0.22);
      border-radius: 10px;
      line-height: 1.45;
    }

    @media (max-width: 560px) {
      .page { padding: 1.25rem 1rem 3rem; }
      .grid { grid-template-columns: 1fr; gap: 1rem; }
    }
  </style>

  <script>
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const visibleCount = document.getElementById("visible-count");
    const totalCount = document.getElementById("total-count");
    const updatedEl = document.getElementById("updated");
    const overlay = document.getElementById("overlay");
    const panel = document.getElementById("panel");
    const panelBody = document.getElementById("panel-body");
    const panelTitle = document.getElementById("panel-title");
    const panelPills = document.getElementById("panel-pills");
    const searchInput = document.getElementById("search");

    let DATA = { angles: [], generated_at_local: "", counts: {} };
    let filter = "all";
    let query = "";
    let byId = {};

    function fmtViews(n) {
      if (n == null || n === "") return "";
      const v = Number(n);
      if (!Number.isFinite(v)) return "";
      if (v >= 1e8) return (v / 1e8).toFixed(1) + " 亿";
      if (v >= 1e4) return (v / 1e4).toFixed(v >= 1e5 ? 0 : 1) + " 万";
      return String(Math.round(v));
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function statusClass(st) {
      if (st === "RISING") return "";
      if (st === "保留") return "keep";
      return "watch";
    }

    function thumbHtml(a) {
      const t = a.thumb || {};
      const plat = (t.platform || "").toLowerCase();
      const isYt = t.type === "youtube" && t.url;
      const isIg = t.type === "instagram" || plat.includes("instagram");
      let tagClass = "";
      let tagText = t.platform || "";
      if (isYt || plat.includes("youtube") || plat.includes("shorts")) {
        tagClass = "yt"; tagText = tagText || "YouTube";
      } else if (isIg) {
        tagClass = "ig"; tagText = "Instagram";
      }
      const views = fmtViews(t.views);
      let media;
      if (isYt) {
        media = `<img src="${esc(t.url)}" alt="" loading="lazy" referrerpolicy="no-referrer"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
          <div class="ph ${a.brand === "OT" ? "ot-ph" : "ff-ph"}" style="display:none">
            <span class="ph-brand">${esc(a.brand)}</span>
            <span class="ph-label">封面加载失败</span>
          </div>`;
      } else if (isIg) {
        media = `<div class="ph ig"><span class="ph-brand">IG</span><span class="ph-label">Instagram</span></div>`;
      } else {
        media = `<div class="ph ${a.brand === "OT" ? "ot-ph" : "ff-ph"}">
          <span class="ph-brand">${esc(a.brand)}</span>
          <span class="ph-label">${esc(tagText || a.brand_name)}</span>
        </div>`;
      }
      return `<div class="card-img">
        ${media}
        ${tagText ? `<span class="platform-tag ${tagClass}">${esc(tagText)}</span>` : ""}
        ${views ? `<span class="views-tag">${esc(views)} 播放</span>` : ""}
      </div>`;
    }

    function cardHtml(a) {
      const stCls = statusClass(a.status);
      const fmt = [a.format_name, a.format_execution].filter(Boolean).join(" · ");
      const score = a.priority_score != null ? Number(a.priority_score).toFixed(3) : "—";
      return `<button type="button" class="card" data-id="${esc(a.id)}" data-brand="${esc(a.brand)}">
        ${thumbHtml(a)}
        <div class="card-body">
          <div class="card-top">
            <span class="pill ${a.brand === "OT" ? "ot" : "ff"}">${esc(a.brand)} · ${esc(a.brand_name)}</span>
            <span class="status-tag ${stCls}">${esc(a.status || "—")}</span>
          </div>
          <div class="card-title">${esc(a.title)}</div>
          <div class="pain">${esc(a.pain_point)}</div>
          ${a.top_hook ? `<div class="hook">${esc(a.top_hook)}</div>` : ""}
          <div class="meta-row">
            ${fmt ? `<span>${esc(fmt)}</span>` : ""}
            ${a.n != null ? `<span>样本 ${esc(a.n)}</span>` : ""}
          </div>
          ${a.compliance ? `<div class="compliance-snip">合规：${esc(a.compliance)}</div>` : ""}
          <div class="card-footer">
            <span class="score">优先级 <strong>${esc(score)}</strong></span>
            <span class="open-hint">详情 →</span>
          </div>
        </div>
      </button>`;
    }

    function matches(a) {
      if (filter !== "all" && a.brand !== filter) return false;
      if (!query) return true;
      const q = query.toLowerCase();
      const bag = [
        a.title, a.pain_point, a.top_hook, a.compliance, a.angle_key,
        ...(a.hooks || []).map(h => h.line),
        ...(a.keywords_observed || []),
        ...(a.why_trending || []),
      ].join(" ").toLowerCase();
      return bag.includes(q);
    }

    function render() {
      const list = DATA.angles || [];
      totalCount.textContent = String(list.length);
      const shown = list.filter(matches);
      visibleCount.textContent = String(shown.length);
      grid.innerHTML = shown.map(cardHtml).join("");
      empty.classList.toggle("visible", shown.length === 0);
      grid.querySelectorAll(".card").forEach(el => {
        el.addEventListener("click", () => openPanel(el.dataset.id));
      });
    }

    function openPanel(id) {
      const a = byId[id];
      if (!a) return;
      panelPills.innerHTML = `
        <span class="pill ${a.brand === "OT" ? "ot" : "ff"}">${esc(a.brand)}</span>
        <span class="status-tag ${statusClass(a.status)}">${esc(a.status || "")}</span>`;
      panelTitle.textContent = a.title || "—";

      const hooks = (a.hooks || []).map(h => `
        <li>
          ${h.hook_type_zh || h.hook_type ? `<span class="ht">${esc(h.hook_type_zh || h.hook_type)}</span>` : ""}
          ${esc(h.line)}
        </li>`).join("") || "<li>（无钩子）</li>";

      const why = (a.why_trending || []).slice(0, 4).map(w => `<li>${esc(w)}</li>`).join("")
        || "<li>—</li>";

      const refs = (a.references || []).map(r => {
        const v = fmtViews(r.views);
        const meta = [r.platform, v ? v + " 播放" : "", r.post_date || ""].filter(Boolean).join(" · ");
        const href = r.url ? esc(r.url) : "#";
        return `<li>
          <a href="${href}" target="_blank" rel="noopener noreferrer">${esc(r.title || r.url || "链接")}</a>
          <div class="ref-meta">${esc(meta)}</div>
        </li>`;
      }).join("") || "<li>暂无参考链接</li>";

      const plats = (a.recommended_platforms || []).join(" · ");

      panelBody.innerHTML = `
        <div class="panel-section">
          <h3>痛点</h3>
          <p>${esc(a.pain_point)}</p>
        </div>
        <div class="panel-section">
          <h3>原创钩子草稿</h3>
          <ul class="hook-list">${hooks}</ul>
        </div>
        <div class="panel-section">
          <h3>格式</h3>
          <p>${esc([a.format_name, a.format_execution].filter(Boolean).join(" — ") || "—")}</p>
          ${plats ? `<p style="margin-top:0.4rem;font-size:0.8rem;color:var(--text-muted)">推荐平台：${esc(plats)}</p>` : ""}
        </div>
        <div class="panel-section">
          <h3>为何保留 / 趋势信号</h3>
          <ul>${why}</ul>
        </div>
        <div class="panel-section">
          <h3>合规</h3>
          <div class="compliance-box">${esc(a.compliance || "见品牌通用合规。")}</div>
        </div>
        <div class="panel-section">
          <h3>参考（新标签打开）</h3>
          <ul class="ref-list">${refs}</ul>
        </div>
        <div class="panel-section">
          <h3>指标</h3>
          <p style="font-size:0.8rem;color:var(--text-muted)">
            优先级 ${a.priority_score != null ? Number(a.priority_score).toFixed(3) : "—"}
            · 样本 n=${a.n ?? "—"}
            · 中位表现 P${a.median_perf_pct != null ? Number(a.median_perf_pct).toFixed(0) : "—"}
            · 前 25% 占比 ${a.top_quartile_share != null ? Math.round(Number(a.top_quartile_share) * 100) + "%" : "—"}
          </p>
        </div>`;

      overlay.hidden = false;
      requestAnimationFrame(() => {
        overlay.classList.add("open");
        panel.classList.add("open");
        panel.setAttribute("aria-hidden", "false");
      });
    }

    function closePanel() {
      overlay.classList.remove("open");
      panel.classList.remove("open");
      panel.setAttribute("aria-hidden", "true");
      setTimeout(() => { overlay.hidden = true; }, 220);
    }

    document.getElementById("panel-close").addEventListener("click", closePanel);
    overlay.addEventListener("click", closePanel);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closePanel();
    });

    document.querySelectorAll(".chip[data-filter]").forEach(btn => {
      btn.addEventListener("click", () => {
        filter = btn.dataset.filter;
        document.querySelectorAll(".chip[data-filter]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render();
      });
    });

    searchInput.addEventListener("input", () => {
      query = searchInput.value.trim();
      render();
    });

    async function loadData() {
      try {
        const r = await fetch("./data.json", { cache: "no-store" });
        if (r.ok) return await r.json();
      } catch (_) { /* file:// or offline */ }
      const el = document.getElementById("angles-data");
      if (el && el.textContent.trim() && el.textContent.trim() !== "{}") {
        return JSON.parse(el.textContent);
      }
      throw new Error("无法加载 data.json，请运行 python3 build_data.py 并用本地服务器打开。");
    }

    loadData().then(data => {
      DATA = data;
      byId = {};
      (DATA.angles || []).forEach(a => { byId[a.id] = a; });
      updatedEl.textContent = DATA.generated_at_local || DATA.built_at_local || "—";
      const md = DATA.weekly_md;
      if (md) {
        document.getElementById("foot-md").innerHTML =
          `本周文字稿：<code>${esc(md.split("/").pop())}</code>`;
      }
      render();
    }).catch(err => {
      updatedEl.textContent = "加载失败";
      empty.textContent = String(err.message || err);
      empty.classList.add("visible");
    });
  </script>
